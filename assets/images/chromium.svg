<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Chromium Blue Icon -->
  <defs>
    <linearGradient id="cr-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="cr-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1967D2"/>
      <stop offset="100%" stop-color="#1557B0"/>
    </linearGradient>
    <linearGradient id="cr-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#669DF6"/>
    </linearGradient>
    <filter id="cr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background base disc -->
  <circle cx="24" cy="24" r="22" fill="#0b1329"/>

  <!-- Left / Lower wing -->
  <path d="M24 44 C15.2 44 7.7 38.3 5 30.2 L14.7 13.5 C13.7 16.6 13.2 19.9 13.2 23.3 C13.2 28.5 15.6 33.1 19.4 36.2 L24 44 Z" fill="url(#cr-left)"/>

  <!-- Top wing -->
  <path d="M24 4 C32.8 4 40.3 9.7 43 17.8 L23.5 17.8 C20.3 17.8 17.5 19.3 15.8 21.7 L6.2 8.5 C10.8 5.7 17.2 4 24 4 Z" fill="url(#cr-top)"/>

  <!-- Right / Bottom wing -->
  <path d="M43 17.8 C43.7 20 44 22.3 44 24.8 C44 34.3 37.3 42.2 28.4 43.8 L18.8 27.2 C19.9 28.3 21.4 29 23 29 C26.3 29 29 26.3 29 23 C29 22.2 28.8 21.5 28.5 20.8 L43 17.8 Z" fill="url(#cr-right)"/>

  <!-- Center Circle (White ring & Blue hub) -->
  <circle cx="24" cy="23.5" r="9.5" fill="#FFFFFF" filter="url(#cr-shadow)"/>
  <circle cx="24" cy="23.5" r="7.5" fill="#1A73E8"/>
  <circle cx="24" cy="23.5" r="6.2" fill="#4285F4"/>
</svg>

