<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="alfieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="alfieAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="alfieWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="alfieGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#alfieBg)" />
  <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Modern Geometric 'A' Wings -->
  <!-- Left Wing -->
  <path d="M 50 18 L 24 76 L 36 76 L 50 42 Z" fill="url(#alfieWhite)" />
  
  <!-- Right Wing with depth -->
  <path d="M 50 18 L 76 76 L 64 76 L 50 42 Z" fill="url(#alfieWhite)" opacity="0.9" />

  <!-- Dynamic Center Bridge / Spark Ribbon -->
  <path d="M 33 56 L 67 56 L 62 64 L 38 64 Z" fill="url(#alfieAccent)" filter="url(#alfieGlow)" />

  <!-- Central Optical Core Node (AI spark) -->
  <circle cx="50" cy="38" r="4.5" fill="#ffffff" filter="url(#alfieGlow)" />
  <circle cx="50" cy="38" r="2" fill="#06b6d4" />

  <!-- Tech Accent Dots -->
  <circle cx="27" cy="80" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="73" cy="80" r="2" fill="#38bdf8" opacity="0.8" />
</svg>
