<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Studio Lighting -->
    <radialGradient id="studioLight" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#151D2A" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0E1217" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="1"/>
    </radialGradient>
    <!-- Cobalt Glow -->
    <radialGradient id="cobaltGlow" cx="65%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6B8CFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6B8CFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6B8CFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassLayer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202836" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#12161E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glassLayer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283347" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#161C26" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glassLayer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34435E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1C2433" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Accent Line Gradient -->
    <linearGradient id="blueBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B8CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9BB6FF" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Drop Shadow Filters -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#040608" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#studioLight)"/>
  <rect width="800" height="600" fill="url(#cobaltGlow)"/>

  <!-- Subtle Perspective Grid Elements -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="500" x2="300" y2="100"/>
    <line x1="250" y1="520" x2="450" y2="80"/>
    <line x1="400" y1="540" x2="600" y2="70"/>
    <line x1="550" y1="550" x2="720" y2="90"/>
  </g>

  <!-- LAYER 1 (Deepest Background Browser Plane) -->
  <g transform="translate(180, 110) skewY(-6) rotate(-2)" filter="url(#softShadow)">
    <rect width="440" height="280" rx="10" fill="url(#glassLayer1)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Mock browser chrome -->
    <circle cx="24" cy="20" r="4" fill="rgba(255,255,255,0.15)"/>
    <circle cx="38" cy="20" r="4" fill="rgba(255,255,255,0.1)"/>
    <circle cx="52" cy="20" r="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="75" y="14" width="200" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <!-- Wireframe content lines -->
    <rect x="30" y="55" width="240" height="10" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="75" width="380" height="8" rx="2" fill="rgba(255,255,255,0.03)"/>
    <rect x="30" y="92" width="340" height="8" rx="2" fill="rgba(255,255,255,0.03)"/>
    <rect x="30" y="120" width="180" height="110" rx="6" fill="rgba(255,255,255,0.03)"/>
    <rect x="230" y="120" width="180" height="110" rx="6" fill="rgba(255,255,255,0.03)"/>
  </g>

  <!-- LAYER 2 (Middle Contextual Plane) -->
  <g transform="translate(210, 150) skewY(-5) rotate(-1)" filter="url(#panelShadow)">
    <rect width="420" height="270" rx="10" fill="url(#glassLayer2)" stroke="rgba(107,140,255,0.2)" stroke-width="1.2"/>
    <!-- Header bar -->
    <line x1="0" y1="38" x2="420" y2="38" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="24" y="14" width="80" height="10" rx="2" fill="rgba(255,255,255,0.2)"/>
    <!-- Interactive markers -->
    <circle cx="36" cy="70" r="5" fill="#6B8CFF" opacity="0.8"/>
    <rect x="52" y="66" width="160" height="8" rx="2" fill="rgba(243,244,246,0.3)"/>
    
    <circle cx="36" cy="110" r="5" fill="rgba(255,255,255,0.2)"/>
    <rect x="52" y="106" width="220" height="8" rx="2" fill="rgba(243,244,246,0.18)"/>

    <circle cx="36" cy="150" r="5" fill="rgba(255,255,255,0.2)"/>
    <rect x="52" y="146" width="190" height="8" rx="2" fill="rgba(243,244,246,0.18)"/>
  </g>

  <!-- LAYER 3 (Front Fore-Layer: User-Directed Intelligent Interface) -->
  <g transform="translate(250, 200) skewY(-4)" filter="url(#panelShadow)">
    <rect width="390" height="250" rx="12" fill="url(#glassLayer3)" stroke="#6B8CFF" stroke-width="1.5"/>
    <!-- Glowing edge highlight -->
    <line x1="12" y1="1" x2="378" y2="1" stroke="url(#blueBeam)" stroke-width="2"/>
    
    <!-- Top toolbar -->
    <rect x="20" y="18" width="110" height="12" rx="3" fill="#6B8CFF" opacity="0.3"/>
    <circle cx="360" cy="24" r="5" fill="#6B8CFF"/>
    
    <!-- Active prompt / contextual action panel -->
    <rect x="20" y="48" width="350" height="70" rx="8" fill="#131822" stroke="rgba(107,140,255,0.4)" stroke-width="1"/>
    <!-- Status indicator badge -->
    <rect x="36" y="60" width="75" height="14" rx="3" fill="rgba(107,140,255,0.2)"/>
    <text x="42" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#6B8CFF" letter-spacing="0.5">ACTIVE LAYER</text>
    <rect x="36" y="84" width="280" height="7" rx="2" fill="#F3F4F6" opacity="0.8"/>
    <rect x="36" y="96" width="190" height="7" rx="2" fill="#A0A6B1" opacity="0.5"/>

    <!-- Action chips at bottom -->
    <rect x="20" y="140" width="105" height="32" rx="6" fill="#182130" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="32" y="152" width="80" height="8" rx="2" fill="#F3F4F6" opacity="0.7"/>

    <rect x="135" y="140" width="105" height="32" rx="6" fill="#182130" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="147" y="152" width="80" height="8" rx="2" fill="#F3F4F6" opacity="0.7"/>

    <rect x="250" y="140" width="120" height="32" rx="6" fill="#202E4B" stroke="#6B8CFF" stroke-width="1"/>
    <rect x="264" y="152" width="92" height="8" rx="2" fill="#6B8CFF" opacity="0.9"/>

    <!-- Subtle Connection Anchor -->
    <circle cx="310" cy="195" r="4" fill="#6B8CFF"/>
    <line x1="310" y1="195" x2="310" y2="235" stroke="#6B8CFF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Geometric markers & nodes -->
  <g fill="#6B8CFF">
    <circle cx="160" cy="240" r="3" opacity="0.7"/>
    <circle cx="680" cy="180" r="3" opacity="0.5"/>
    <circle cx="660" cy="380" r="3.5" opacity="0.8"/>
    <circle cx="190" cy="420" r="2.5" opacity="0.6"/>
  </g>
</svg>
