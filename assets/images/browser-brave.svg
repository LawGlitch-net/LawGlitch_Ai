    <path d="M24 2 L33 6 L38 13 L43 14 L41 21 L45 27 L39 36 L34 38 L30 45 L24 46 L18 45 L14 38 L9 36 L3 27 L7 21 L5 14 L10 13 L15 6 Z" fill="url(#braveGrad)" />
