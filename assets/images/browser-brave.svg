      <stop offset="0%" stop-color="#FF7654" />
      <stop offset="50%" stop-color="#FB542B" />
      <stop offset="100%" stop-color="#D92800" />
    </linearGradient>
    <linearGradient id="braveDark" x1="0%" y1="0%" x2="100%" y2="100%">
